:1100px}.panel{margin:0;padding:20px;min-height:100vh}}@media(min-width:1536px){.scene{width:100vw}}</style></head><body><div id="app"></div><script>const app=document.getElementById('app');const brands=['PRESERA','andreianazare.pt','itsmeandreia.nazare','alma.sentido.vida','Las Mujeres','CIAORA STUDIO','CIAORA LAB','CIAORA VENTURES'];const doors=[['NEGÓCIOS','business'],['RIRA','rira'],['INTELIGÊNCIAS','intelligence'],['PROJETOS','projects'],['BIBLIOTECA','library'],['AGENDA','agenda']];function go(p,n){location.hash=p+(n?'/'+encodeURIComponent(n):'')}function safe(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function clients(){try{return JSON.parse(localStorage.getItem('ciaora-demo-clients'))||['Monique','Cristina']}catch{return ['Monique','Cristina']}}function home(){const hit=(x,y,w,h,p,label)=>`<button class="hotspot" style="left:${x/1536*100}%;top:${y/1024*100}%;width:${w/1536*100}%;height:${h/1024*100}%" data-go="${p}" aria-label="${label}" title="${label}"></button>`;app.innerHTML=`<div class="mobile-hint">← Desliza para explorar o palácio →</div><div class="scene-scroll"><div class="scene" role="img" aria-label="Palácio CIAORA com seis portas e galeria de negócios">${hit(0,0,300,75,'home','Início')}${hit(310,0,100,75,'home','Início')}${hit(405,0,90,75,'home','A Casa')}${hit(492,0,95,75,'business','Negócios')}${hit(583,0,75,75,'rira','RIRA')}${hit(658,0,130,75,'intelligence','Inteligências')}${hit(788,0,105,75,'projects','Projetos')}${hit(895,0,110,75,'library','Biblioteca')}${hit(1005,0,95,75,'agenda','Agenda')}${doors.map((d,i)=>hit(211+i*198,452,177,280,d[1],d[0])).join('')}${brands.map((b,i)=>hit(278+i*124,800,118,143,i===0?'presera':'brand',b)).join('')}${hit(1075,766,194,39,'business','Ver todos os negócios')}</div></div>`}function panel(title,body,back='home'){app.innerHTML=`<main class="panel"><button class="back" data-go="${back}">← VOLTAR</button><h1>${safe(title)}</h1>${body}</main>`}function render(){let [p,n]=location.hash.slice(1).split('/');p=p||'home';if(p==='home')home();else if(p==='business')panel('NEGÓCIOS',`<div class="grid">${brands.map((b,i)=>`<button class="client" data-go="${i===0?'presera':'brand'}">${safe(b)} →</button>`).join('')}</div>`);else if(p==='presera')panel('PRESERA',`<p>MEMÓRIA · ESTRATÉGIA · TRANSFORMAÇÃO</p><button class="action" id="new">+ CRIAR CASA DE DEMONSTRAÇÃO</button><div class="grid">${clients().map(c=>`<button class="client" data-client="${encodeURIComponent(c)}">⌂ ${safe(c)} →</button>`).join('')}</div><p class="muted">Protótipo: dados locais neste dispositivo. Não introduzir dados confidenciais de clientes.</p>`,'business');else if(p==='client')panel('CASA '+decodeURIComponent(n||''),`<div class="grid">${['BASE','SCANNER','MAPA','CONSTRUÇÃO','EVOLUÇÃO','DOCUMENTOS'].map(s=>`<button class="client" data-section="${s}">${s} →</button>`).join('')}</div><p class="muted" id="detail">Divisões de demonstração, sem dados reais ligados.</p>`,'presera');else panel((doors.find(d=>d[1]===p)||['CIAORA'])[0],`<p class="muted">Área em desenvolvimento. Ainda sem autenticação ou integração com inteligência artificial.</p><button class="action" data-go="presera">ENTRAR NA PRESERA →</button>`);document.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>go(e.dataset.go));document.querySelectorAll('[data-client]').forEach(e=>e.onclick=()=>go('client',decodeURIComponent(e.dataset.client)));document.querySelectorAll('[data-section]').forEach(e=>e.onclick=()=>document.getElementById('detail').textContent=e.dataset.section+' · Demonstração.');let add=document.getElementById('new');if(add)add.onclick=()=>{let n=prompt('Nome da casa de demonstração');if(n&&n.trim()){let c=clients();c.push(n.trim().slice(0,80));localStorage.setItem('ciaora-demo-clients',JSON.stringify(c));render()}}}addEventListener('hashchange',render);render();</script></body></html>
