<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#241510"><title>CIAORA OS · Welcome Home</title><style>:root{font-family:Georgia,'Times New Roman',serif;color:#f6e6cb;background:#1b110e}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 5%,#65432e,#1b110e 68%)}button,input{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:4;background:#1d120feF;border-bottom:1px solid #a47b48;padding:12px 4%;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}header strong{letter-spacing:.24em;font-size:1.5rem}header small{display:block;font-size:.55rem;letter-spacing:.3em}nav{display:flex;gap:6px;flex-wrap:wrap}nav button,.back{color:#f4dfbd;background:transparent;border:0;padding:10px;font-size:.73rem}nav button:hover,.back:hover{color:white;text-decoration:underline}main{max-width:1500px;margin:auto;padding:20px 3%}.palace{border:4px ridge #c59a60;background:linear-gradient(90deg,#301911 0%,#b78b5b 2%,#43291d 5%,transparent 13%,transparent 87%,#43291d 95%,#b78b5b 98%,#301911),radial-gradient(ellipse at 50% 5%,#e0bb82,#8d5d3c 18%,#37231a 45%,#1a100e 85%);box-shadow:inset 0 0 80px #000b,0 20px 60px #0009;padding:45px 25px 30px;min-height:550px;position:relative}.palace:before{content:'✧';display:block;text-align:center;color:#f6d4a0;font-size:2.8rem}.hero{text-align:center}.hero h1{font-size:clamp(3rem,8vw,7rem);font-weight:normal;letter-spacing:.14em;margin:0;text-shadow:0 5px 12px #1a0b07}.hero p{letter-spacing:.25em;font-size:.8rem;margin:8px}.hero .motto{line-height:1.7;letter-spacing:.12em;margin:20px auto 30px}.doors{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}.door{color:#f5e2bf;min-height:250px;border:3px ridge #d3ab70;border-radius:48% 48% 3px 3px / 20% 20% 3px 3px;background:radial-gradient(ellipse at 50% 12%,#b78b5b,#573825 35%,#1d120f 85%);box-shadow:inset 0 0 0 5px #3d281c,inset 0 0 30px #e8b66c55,0 7px 15px #0009;display:flex;flex-direction:column;align-items:center;justify-content:end;gap:9px;padding:16px 5px;transition:transform .2s}.door:hover,.tile:hover,.client:hover{transform:translateY(-4px);filter:brightness(1.2)}.symbol{font-size:3rem;flex:1;display:grid;place-items:center}.door b{font-size:clamp(.7rem,1.2vw,1rem)}.door small{font-family:Arial,sans-serif;font-size:.55rem}.door em{font-size:.65rem;font-style:normal;border:1px solid #c49b62;border-radius:20px;padding:5px 12px}.business{background:#eadcc8;color:#39271d;padding:18px;margin-top:20px;border:2px solid #b28a54}.business h2{font-weight:normal;letter-spacing:.1em;font-size:1rem}.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.tile{background:linear-gradient(#f5ebdc,#e2cbae);border:1px solid #b69a70;min-height:140px;padding:12px;color:#3c291c;transition:transform .2s}.tile span{display:block;font-size:2.3rem;margin-bottom:14px}.tile b{display:block;font-size:.85rem}.tile small{font-size:.6rem;font-family:Arial,sans-serif}.panel{max-width:1050px;margin:30px auto;padding:28px;background:#2a1a15;border:1px solid #b9905c;min-height:60vh}.panel h1{font-size:clamp(2rem,6vw,4rem);font-weight:normal;color:#edcb97}.panel p{line-height:1.6}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:22px 0}.client{background:#4b3024;border:1px solid #bb935f;color:#f5e1c2;padding:22px;text-align:left;min-height:100px;transition:transform .2s}.client b{display:block;margin-bottom:12px}.action{background:#c09a62;border:1px solid #e1c18d;color:#21130e;padding:12px 20px}.muted{font-size:.85rem;color:#cdb99c}footer{text-align:center;padding:25px;font-size:.65rem;letter-spacing:.2em;color:#c9aa7b}@media(max-width:900px){.doors{grid-template-columns:repeat(3,1fr)}.tiles{grid-template-columns:repeat(2,1fr)}.door{min-height:190px}}@media(max-width:500px){main{padding:10px}.palace{padding:22px 9px}.doors{grid-template-columns:repeat(2,1fr);gap:8px}.door{min-height:175px}.hero h1{letter-spacing:.05em}.hero .motto{font-size:.72rem}.tile{min-height:120px}header{padding:12px}}</style></head><body><header><strong>◉ CIAORA<small>WELCOME HOME</small></strong><nav><button data-go="home">INÍCIO</button><button data-go="business">NEGÓCIOS</button><button data-go="rira">RIRA</button><button data-go="intelligence">INTELIGÊNCIAS</button><button data-go="projects">PROJETOS</button><button data-go="library">BIBLIOTECA</button><button data-go="agenda">AGENDA</button></nav></header><main id="app"></main><footer>CIAORA · PESSOAS EXTRAORDINÁRIAS · NEGÓCIOS COM ALMA · UM FUTURO EM CONSTRUÇÃO</footer><script>const app=document.getElementById('app');const doors=[['business','NEGÓCIOS','MARCAS E EXPANSÃO','♜'],['rira','RIRA','CENTRAL PRIVADA','✧'],['intelligence','INTELIGÊNCIAS','IA E AUTOMAÇÕES','✺'],['projects','PROJETOS','IDEIAS EM EVOLUÇÃO','♙'],['library','BIBLIOTECA','CONHECIMENTO','▤'],['agenda','AGENDA','TEMPO COM INTENÇÃO','◷']];const brands=[['PRESERA','MEMÓRIA · ESTRATÉGIA','♛','presera'],['andreianazare.pt','CONSULTORIA · EXPANSÃO','♜','brand'],['itsmeandreia.nazare','MARCA PESSOAL','✧','brand'],['alma.sentido.vida','CURA · EMOÇÃO','❀','brand'],['Las Mujeres','DIGNIDADE · RELAÇÕES','♕','brand'],['CIAORA STUDIO','MARCA · CONTEÚDO','✦','brand'],['CIAORA LAB','INOVAÇÃO','⚙','brand'],['CIAORA VENTURES','INVESTIMENTO','◈','brand']];function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function clients(){try{const v=JSON.parse(localStorage.getItem('ciaora-demo-clients'));return Array.isArray(v)?v:['Monique','Cristina']}catch{return ['Monique','Cristina']}}function go(p,n){location.hash=p+(n?'/'+encodeURIComponent(n):'')}function render(){let [p,n]=location.hash.slice(1).split('/');p=p||'home';if(p==='home')app.innerHTML=`<section class="palace"><div class="hero"><h1>CIAORA</h1><p>WELCOME HOME</p><div class="motto">PESSOAS EXTRAORDINÁRIAS<br>NEGÓCIOS COM ALMA<br>UM FUTURO EM CONSTRUÇÃO</div></div><div class="doors">${doors.map(d=>`<button class="door" data-go="${d[0]}"><span class="symbol">${d[3]}</span><b>${d[1]}</b><small>${d[2]}</small><em>ENTRAR →</em></button>`).join('')}</div></section><section class="business"><h2>OS NOSSOS NEGÓCIOS</h2><div class="tiles">${brands.map(b=>`<button class="tile" data-go="${b[3]}"><span>${b[2]}</span><b>${b[0]}</b><small>${b[1]}</small></button>`).join('')}</div></section>`;else if(p==='business')app.innerHTML=`<section class="panel"><button class="back" data-go="home">← PALÁCIO</button><h1>NEGÓCIOS</h1><div class="tiles">${brands.map(b=>`<button class="tile" data-go="${b[3]}"><span>${b[2]}</span><b>${b[0]}</b><small>${b[1]}</small></button>`).join('')}</div></section>`;else if(p==='presera')app.innerHTML=`<section class="panel"><button class="back" data-go="business">← NEGÓCIOS</button><h1>PRESERA</h1><p>MEMÓRIA · ESTRATÉGIA · TRANSFORMAÇÃO</p><button class="action" id="new">+ CRIAR CASA</button><div class="cards">${clients().map(c=>`<button class="client" data-client="${encodeURIComponent(c)}"><b>⌂ ${safe(c)}</b>ENTRAR NA CASA →</button>`).join('')}</div><p class="muted">Demonstração: nomes guardados apenas neste navegador. Não guardar informação confidencial aqui.</p></section>`;else if(p==='client')app.innerHTML=`<section class="panel"><button class="back" data-go="presera">← PRESERA</button><h1>CASA ${safe(decodeURIComponent(n||'').toUpperCase())}</h1><div class="cards">${['BASE','SCANNER','MAPA','CONSTRUÇÃO','EVOLUÇÃO','DOCUMENTOS'].map(t=>`<button class="client" data-section="${t}"><b>${t}</b>ABRIR →</button>`).join('')}</div><p class="muted" id="detail">Escolhe uma divisão. Ainda não há dados reais nem scanners ligados.</p></section>`;else{const d=doors.find(x=>x[0]===p);app.innerHTML=`<section class="panel"><button class="back" data-go="home">← PALÁCIO</button><h1>${d?d[1]:'CIAORA'}</h1><p class="muted">Área reservada para futura implementação. Nenhuma inteligência artificial está ligada nesta versão.</p><button class="action" data-go="presera">ENTRAR NA PRESERA →</button></section>`}document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));document.querySelectorAll('[data-client]').forEach(b=>b.onclick=()=>go('client',decodeURIComponent(b.dataset.client)));document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>document.getElementById('detail').textContent=b.dataset.section+' · Divisão de demonstração, sem dados reais.');const add=document.getElementById('new');if(add)add.onclick=()=>{const n=prompt('Nome do cliente');if(n&&n.trim()){const c=clients();c.push(n.trim().slice(0,80));localStorage.setItem('ciaora-demo-clients',JSON.stringify(c));render()}}}addEventListener('hashchange',render);render();</script></body></html>
