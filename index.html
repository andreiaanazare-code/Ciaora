':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function go(p,n){location.hash=p+(n?'/'+encodeURIComponent(n):'');render()}function render(){let [p,n]=location.hash.slice(1).split('/');p=p||'home';if(p==='home'){app.innerHTML=document.getElementById('home-template').innerHTML}else if(p==='presera'){app.innerHTML=`<section class="panel"><button class="back" data-go="home">← PALÁCIO</button><h1>PRESERA</h1><p>MEMÓRIA · ESTRATÉGIA · TRANSFORMAÇÃO</p><button class="action" id="new">+ CRIAR CASA DE DEMONSTRAÇÃO</button><div class="cards">${clients().map(c=>`<button class="client" data-client="${encodeURIComponent(c)}"><b>⌂ ${safe(c)}</b>ENTRAR NA CASA →</button>`).join('')}</div><p class="muted">Protótipo: os nomes ficam apenas neste navegador. Não guardar dados confidenciais.</p></section>`}else if(p==='client'){app.innerHTML=`<section class="panel"><button class="back" data-go="presera">← PRESERA</button><h1>CASA ${safe(decodeURIComponent(n||'').toUpperCase())}</h1><div class="cards">${['BASE','SCANNER','MAPA','CONSTRUÇÃO','EVOLUÇÃO','DOCUMENTOS'].map(t=>`<button class="client" data-section="${t}"><b>${t}</b>ABRIR →</button>`).join('')}</div><p class="muted" id="detail">Escolhe uma divisão. Ainda não existem dados reais nem scanners ligados.</p></section>`}else{const names={business:'NEGÓCIOS',rira:'RIRA',intelligence:'INTELIGÊNCIAS',projects:'PROJETOS',library:'BIBLIOTECA',agenda:'AGENDA'};app.innerHTML=`<section class="panel"><button class="back" data-go="home">← PALÁCIO</button><h1>${p==='brand'?safe(decodeURIComponent(n||'MARCA')):(names[p]||'CIAORA')}</h1><p class="muted">Esta área é um protótipo de navegação. Ainda não há serviços, automações ou contas ligados.</p><button class="action" data-go="presera">ENTRAR NA PRESERA →</button></section>`}document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go,b.dataset.brand));document.querySelectorAll('[data-client]').forEach(b=>b.onclick=()=>go('client',decodeURIComponent(b.dataset.client)));document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>document.getElementById('detail').textContent=b.dataset.section+' · Divisão de demonstração, sem dados reais.');const add=document.getElementById('new');if(add)add.onclick=()=>{const n=prompt('Nome do cliente de demonstração');if(n&&n.trim()){const c=clients();c.push(n.trim().slice(0,80));localStorage.setItem('ciaora-demo-clients',JSON.stringify(c));render()}}}addEventListener('hashchange',render);render();</script></body></html>
